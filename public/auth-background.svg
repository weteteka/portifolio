<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#0c1011"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="0%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#0d9488" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="100%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.20"/>
      <stop offset="45%" stop-color="#14b8a6" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTop" cx="55%" cy="-10%" r="55%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#14b8a6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="80%" stop-color="#14b8a6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.25"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.035"/>
      </feComponentTransfer>
    </filter>

    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glowLeft)"/>
  <rect width="1920" height="1080" fill="url(#glowRight)"/>
  <rect width="1920" height="1080" fill="url(#glowTop)"/>

  <g filter="url(#soft)">
    <path d="M -200 760 C 260 520, 520 900, 960 620 S 1660 260, 2120 520 L 2120 1200 L -200 1200 Z" fill="url(#wave1)"/>
    <path d="M -200 980 C 320 700, 700 1080, 1120 820 S 1720 520, 2120 760 L 2120 1200 L -200 1200 Z" fill="url(#wave2)"/>
    <path d="M -200 240 C 300 420, 620 80, 1080 300 S 1700 560, 2120 300 L 2120 -200 L -200 -200 Z" fill="url(#wave2)" opacity="0.45"/>
  </g>

  <g fill="none" stroke="url(#lineFade)" stroke-width="1">
    <path d="M -100 700 C 340 470, 560 860, 1000 580 S 1640 230, 2020 480"/>
    <path d="M -100 740 C 340 510, 560 900, 1000 620 S 1640 270, 2020 520" opacity="0.6"/>
    <path d="M -100 940 C 320 660, 700 1040, 1120 780 S 1720 480, 2020 720" opacity="0.5"/>
    <path d="M -100 260 C 300 440, 620 100, 1080 320 S 1700 580, 2020 320" opacity="0.4"/>
  </g>

  <g fill="#5eead4">
    <circle cx="180" cy="300" r="2" opacity="0.35"/>
    <circle cx="320" cy="820" r="1.5" opacity="0.25"/>
    <circle cx="520" cy="180" r="2.5" opacity="0.30"/>
    <circle cx="700" cy="930" r="1.5" opacity="0.20"/>
    <circle cx="1450" cy="240" r="2" opacity="0.30"/>
    <circle cx="1620" cy="880" r="2.5" opacity="0.25"/>
    <circle cx="1780" cy="420" r="1.5" opacity="0.35"/>
    <circle cx="1900" cy="700" r="2" opacity="0.25"/>
    <circle cx="1200" cy="120" r="1.5" opacity="0.25"/>
    <circle cx="980" cy="1010" r="2" opacity="0.20"/>
  </g>
  <g fill="#6ee7b7">
    <circle cx="240" cy="620" r="1.5" opacity="0.25"/>
    <circle cx="860" cy="360" r="2" opacity="0.20"/>
    <circle cx="1320" cy="960" r="1.5" opacity="0.30"/>
    <circle cx="1840" cy="180" r="2" opacity="0.25"/>
  </g>

  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.6"/>
  <rect width="1920" height="1080" fill="#09090b" opacity="0.28"/>
</svg>
